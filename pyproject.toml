[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getopendatafvg"
version = "0.1.0"
description = "Extract and visualize open geographic, socio-economic and environmental data for Friuli Venezia Giulia"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Leonardo Venturoso" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "boto3",
  "duckdb",
  "numpy",
  "rasterio",
  "requests",
  "shapely",
]

[project.urls]
Homepage = "https://github.com/leoventuroso/getopendatafvg"
Issues = "https://github.com/leoventuroso/getopendatafvg/issues"

[project.optional-dependencies]
viz = ["matplotlib"]
dev = ["pytest", "pytest-cov", "ruff", "getopendatafvg[viz]"]

[tool.hatch.build.targets.wheel]
packages = ["src/getopendatafvg"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["getopendatafvg"]
branch = true

[tool.coverage.report]
# 96.6% with branch coverage on, as of 2026-09-25 (97% by line alone).
# The threshold sits below that on purpose: it is a
# ratchet against a real regression, not a target to chase. What is left
# uncovered is defensive branches - fallback returns, `continue` past a
# malformed entry, the ImportError guard for the optional viz extra -
# where a test would assert the mock more than the code.
fail_under = 95
show_missing = true
