[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getopendatafvg"
version = "0.1.0"
description = "Extract and visualize open geographic, socio-economic and environmental data for Friuli Venezia Giulia"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Leonardo Venturoso" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "boto3",
  "numpy",
  "rasterio",
  "requests",
  "shapely",
]

[project.urls]
Homepage = "https://github.com/leoventuroso/getopendatafvg"
Issues = "https://github.com/leoventuroso/getopendatafvg/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/getopendatafvg"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
