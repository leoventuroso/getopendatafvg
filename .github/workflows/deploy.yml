name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Assemble Pages artifact
        # GitHub Pages always publishes at the repo-name root; the comune name
        # is an extra path segment (matches vite.config.ts's base), so the
        # build output has to be nested under it. A tiny redirect at the true
        # root avoids a dead-end 404 if someone visits the repo-name URL bare.
        run: |
          mkdir -p publish/montereale-valcellina
          cp -r frontend/dist/. publish/montereale-valcellina/
          echo '<meta http-equiv="refresh" content="0; url=montereale-valcellina/">' > publish/index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - id: deployment
        uses: actions/deploy-pages@v4
