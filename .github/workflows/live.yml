name: Live sources

# The catalog's identifiers point at two government services this repo
# does not control: a layer can be renamed or retired upstream and every
# offline test still passes. tests/test_catalog_live.py is the check for
# that, but it is opt-in, so on its own it only ever runs when someone
# remembers to run it. This is the thing that remembers.
#
# Weekly rather than per-push: the catalog changes rarely, the failure it
# looks for arrives on the services' schedule and not ours, and these are
# public services that should not be hit on every commit.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays, 06:00 UTC
  workflow_dispatch:      # and on demand, from the Actions tab

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -e ".[dev]"

      - name: Check every catalog entry against its live source
        env:
          GETOPENDATAFVG_LIVE: '1'
        run: pytest tests/test_catalog_live.py -v --no-cov
