name: Rebuild DuckDB Static Asset

on:
  workflow_dispatch:
  repository_dispatch:
    types: [community-write-requested]

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Rebuild static DuckDB file
        run: python pipeline/scripts/init_duckdb.py

      - name: Upload generated artifact
        uses: actions/upload-artifact@v4
        with:
          name: community-data-duckdb
          path: frontend/public/data/community_data.duckdb
